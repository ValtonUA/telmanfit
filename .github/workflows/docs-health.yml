name: Documentation health
run-name: TelmanFit CI ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.base.sha }}

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs links, roadmap and PR impact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require feature branch for master PR
        if: github.event_name == 'pull_request'
        env:
          FEATURE_BRANCH: ${{ github.head_ref }}
        run: python3 -c 'import os; assert os.environ["FEATURE_BRANCH"].startswith("feature/"), "Only feature/* may target master"'
      - name: Unit-test documentation guard
        run: python3 -m unittest discover -s tests/docs -p 'test_*.py' -v
      - name: CI gate regression tests
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
      - name: Verify T1.5 owner-provided source data (read-only)
        run: python3 scripts/validate_t15_source.py
      - name: Validate documentation links and roadmap status IDs
        run: python3 scripts/docs_guard.py
      - name: Require a documentation review for source changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/docs_guard.py --pr-base "$BASE_SHA"
