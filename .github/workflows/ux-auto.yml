name: UX-AUTO bootstrap simulation
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Лише mock; live заблоковано у bootstrap'
        type: choice
        options: [simulate]
        default: simulate
permissions:
  contents: read
concurrency:
  group: ux-auto-bootstrap
  cancel-in-progress: false
jobs:
  simulate:
    name: UX-AUTO mock acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate dispatch
        env:
          MODE: ${{ inputs.mode }}
        run: test "$MODE" = simulate
      - name: Coordinator negative and recovery tests
        run: python3 -m unittest discover -s tests/ci -p 'test_ux_auto.py' -v
      - name: Six-stage success and bounded fixes
        run: |
          python3 -m scripts.ux_auto.coordinator simulate --directory /tmp/ux-auto-success
          python3 -m scripts.ux_auto.coordinator simulate --scenario retry --directory /tmp/ux-auto-retry
      - name: Save explicitly synthetic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-auto-mock-evidence
          path: /tmp/ux-auto-*/report.json
          if-no-files-found: error
          retention-days: 7
