name: Temporary targeted food catalog check
on:
  push:
    branches: [feat/r2-image-matching]
permissions:
  contents: read
concurrency:
  group: targeted-food-catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4.27'
          extensions: pdo_pgsql, pgsql, pdo_sqlite, intl, mbstring, dom
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: php scripts/check-php-runtime.php
      - run: composer install --no-interaction --prefer-dist --no-scripts --no-plugins
      - run: php artisan package:discover --ansi
      - run: php artisan filament:upgrade --ansi
      - run: composer check-platform-reqs
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm ci --prefix client --ignore-scripts
      - run: npm run build --prefix client
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0
      - run: python -m playwright install chromium
      - name: Recipe PostgreSQL plus only catalog browser flows
        env:
          RECIPE_BATCH_ONLY: '1'
          RECIPE_BATCH_BROWSER: '1'
          FOOD_CATALOG_ONLY: '1'
        run: bash tests/pg/run-stage1.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: targeted-food-catalog
          path: |
            tests/pg/out/*.out
            docs/evidence/food-catalog/*.png
            docs/evidence/food-catalog/checks.json
