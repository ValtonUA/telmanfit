name: Full PR
on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled]
permissions:
  contents: read
concurrency:
  group: full-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  stage1:
    if: github.event.label.name == 'ci:full'
    uses: ./.github/workflows/stage1.yml
    with:
      head: ${{ github.event.pull_request.head.sha }}
      base: ${{ github.event.pull_request.base.sha }}
  runtime:
    if: github.event.label.name == 'ci:full'
    uses: ./.github/workflows/php-runtime.yml
    with:
      head: ${{ github.event.pull_request.head.sha }}
      base: ${{ github.event.pull_request.base.sha }}
  compose:
    if: github.event.label.name == 'ci:full'
    uses: ./.github/workflows/local-compose.yml
    with:
      head: ${{ github.event.pull_request.head.sha }}
      base: ${{ github.event.pull_request.base.sha }}
  docs:
    if: github.event.label.name == 'ci:full'
    name: Full documentation and base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current base included in tested head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git merge-base --is-ancestor "$BASE_SHA" HEAD
      - run: python3 -m unittest discover -s tests/docs -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
      - name: Documentation guard with actual PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/docs_guard.py --pr-base "$BASE_SHA"
  gate:
    name: Full PR gate
    needs: [stage1, runtime, compose, docs]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Leave optional Full idle when it was not requested
        if: github.event.label.name != 'ci:full'
        run: echo "Full CI was not requested for this PR event."
      - name: Reject every non-success dependency after an explicit request
        if: github.event.label.name == 'ci:full'
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert set(results) == {'stage1', 'runtime', 'compose', 'docs'}, results
          assert all(job['result'] == 'success' for job in results.values()), results
          PY
