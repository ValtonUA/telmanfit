name: UX-AUTO adapter contracts
on:
  pull_request:
    branches: [master, feat/ux-auto-bootstrap]
permissions:
  contents: read
concurrency:
  group: ux-auto-adapters-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  contracts:
    name: UX-AUTO live adapter contracts (no secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: All controller and CI regression tests
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
      - name: Documentation regression and PR impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 -m unittest discover -s tests/docs -v
          python3 scripts/docs_guard.py --pr-base "$BASE_SHA"
      - name: Install pinned Chromium test tools
        run: |
          python3 -m venv /tmp/ux-auto-oracle-venv
          /tmp/ux-auto-oracle-venv/bin/pip install 'playwright==1.62.0'
          /tmp/ux-auto-oracle-venv/bin/python -m playwright install chromium
      - name: External oracle positive and hostile DOM regression tests
        run: /tmp/ux-auto-oracle-venv/bin/python -m unittest discover -s tests/ux_auto_oracle -v
