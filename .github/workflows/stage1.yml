name: Stage 1 PostgreSQL
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4.27'
          extensions: pdo_pgsql, pgsql, pdo_sqlite, intl, mbstring, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: php scripts/check-php-runtime.php
      - run: composer install --no-interaction --prefer-dist
      - run: composer check-platform-reqs
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm ci --prefix client
      - run: npm run lint --prefix client
      - run: npm run build --prefix client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: AUTH3_BROWSER=1 AUTH4_BROWSER=1 AUTH5_BROWSER=1 tests/pg/run-stage1.sh
      - name: AUTH-6B B3/B4 migration, outbox, privileges, security and concurrency
        shell: bash
        run: AUTH6B_ONLY=1 tests/pg/run-stage1.sh | tee tests/pg/out/auth6b.out
      - run: bash tests/pg/test-runner.sh
      - run: bash tests/pg/run-isolated-pg.sh
      - name: AUTH-1 regression
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if bash experiments/auth1/run.sh > tests/pg/out/auth1.out 2>&1; then
            tail -2 tests/pg/out/auth1.out
          else
            python3 - <<'PYCODE'
          from pathlib import Path
          text = '\n'.join(Path('tests/pg/out/auth1.out').read_text().splitlines()[-30:])
          print('::error::AUTH-1 regression failed: ' + text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PYCODE
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-pg-logs
          path: |
            tests/pg/out/*.out
            docs/evidence/auth3/*.png
            docs/evidence/auth3/results.json
            docs/evidence/auth4/*.png
            docs/evidence/auth4/results.json
            docs/evidence/auth5/*.png
            docs/evidence/auth5/results.json
            docs/evidence/auth6/*.json
