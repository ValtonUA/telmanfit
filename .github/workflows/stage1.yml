name: Stage 1 PostgreSQL
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, pdo_sqlite, intl, mbstring, dom
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: composer install --no-interaction --prefer-dist
      - run: npm install --ignore-scripts
      - run: npm run build
      - run: npm ci --prefix client
      - run: npm run lint --prefix client
      - run: npm run build --prefix client
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: AUTH3_BROWSER=1 tests/pg/run-stage1.sh
      - run: bash tests/pg/test-runner.sh
      - run: bash tests/pg/run-isolated-pg.sh
      - run: bash experiments/auth1/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-pg-logs
          path: |
            tests/pg/out/*.out
            docs/evidence/auth3/*.png
            docs/evidence/auth3/results.json
