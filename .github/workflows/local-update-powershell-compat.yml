name: Local update PowerShell compatibility
run-name: TelmanFit CI ${{ github.event.pull_request.head.sha }} ${{ github.event.pull_request.base.sha }}

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  parse-coordinator:
    name: Parse coordinator with ${{ matrix.host }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Windows PowerShell 5.1
            executable: powershell.exe
          - host: PowerShell 7
            executable: pwsh.exe
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify coordinator encoding and syntax without running it
        shell: cmd
        run: ${{ matrix.executable }} -NoLogo -NoProfile -File tests/local-update-powershell-compat.ps1
      - name: Test coordinator and native CLI handling
        shell: cmd
        run: ${{ matrix.executable }} -NoLogo -NoProfile -File tests/local-update-coordinator.ps1
      - name: Test feature environment isolation and failure handling
        shell: cmd
        run: py -3 -m unittest discover -s tests/ci -p test_feature_env.py -v
      - name: Execute feature launcher with native arguments and unchanged execution policy
        shell: cmd
        run: ${{ matrix.executable }} -NoLogo -NoProfile -File tests/feature-powershell-launch.ps1
      - name: Bootstrap exact SHA with real native Git in isolated synthetic paths
        shell: cmd
        run: ${{ matrix.executable }} -NoLogo -NoProfile -File tests/feature-bootstrap.ps1
